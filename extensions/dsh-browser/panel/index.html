<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- `light` here pinned the page to a light colour scheme whatever the system
         said: the canvas, scrollbars and native controls stayed light while the
         stylesheet below them switched to dark, and a user whose macOS turns dark
         at sunset got exactly that mix. `light dark` lets the user agent follow
         the same `prefers-color-scheme` value the stylesheet reads. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1f24" />
    <title>AI Browser Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
