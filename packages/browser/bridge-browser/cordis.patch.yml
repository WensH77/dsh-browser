# Browser bridge layer for the dsh `web` profile.
#
# `dsh plugin --profile web add` registers this package's `dsh.bundle`
# manifest, so both the repository launcher and `npx @deepseek-ai/dsh@0.1.2 web`
# apply this patch without an extra command-line option.
#
# On first boot the plugin generates a bearer token and persists it at
# ~/.dsh/ext-bridge-token (chmod 0600). Local extensions discover the bridge
# without manual token entry. To pin a fixed token for a remote deployment,
# set DSH_EXT_TOKEN and reference it below.
#
# The bridge is a pure tool channel: chat, sessions, settings, and credentials
# belong to standard dsh clients (web GUI / CLI). Sessions are created by the
# client driving the browser, not by the extension.
#
# Security: the bridge path carries its own token auth and serves no gateway
# methods — only tool frames and the two bridge-internal RPCs
# (bridge.injectBrowserSnapshot, bridge.session.purge). Do not run
# `dsh web --host 0.0.0.0` on untrusted networks with this layer.

- insert:
    - id: bridge-browser
      name: '@yuxianglin/dsh-bridge-browser'
      config:
        token: !!js process.env.DSH_EXT_TOKEN
        toolTimeoutMs: 90000
        snapshotMaxChars: 32000
        maxInteractiveItems: 60
